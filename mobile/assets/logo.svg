<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#14141f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Hexagon "gate" -->
  <polygon points="512,150 800,320 800,660 512,830 224,660 224,320"
           fill="none" stroke="url(#accent)" stroke-width="18" opacity="0.55"/>

  <!-- Upward chevrons = "Arise / level up" -->
  <g filter="url(#glow)" stroke="url(#accent)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="360,620 512,470 664,620"/>
    <polyline points="360,730 512,580 664,730" opacity="0.65"/>
  </g>

  <!-- Monarch spark -->
  <circle cx="512" cy="392" r="26" fill="#a78bfa" filter="url(#glow)"/>
</svg>
